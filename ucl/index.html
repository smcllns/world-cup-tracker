<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Champions League Tracker 2026/27 — scores, fixtures &amp; table</title>
    <meta
      name="description"
      content="Every 2026/27 Champions League match in your timezone — live scores, club crests, the league-phase table and knockout ties."
    />
    <meta name="theme-color" content="#070b24" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://site.api.espn.com" crossorigin />
    <link rel="preconnect" href="https://a.espncdn.com" />

    <!-- PWA: its own manifest + icon, so it installs as a separate home-screen app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UCL Tracker" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Champions League Tracker 2026/27" />
    <meta property="og:description" content="Every match, score &amp; the league table — in your timezone." />
    <script>
      // Set the theme before paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem('ucl:theme')
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ucl/main.jsx"></script>
  </body>
</html>
